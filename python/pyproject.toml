[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-ai"
version = "0.1.0"
description = "Aegis-AI — DAST-style security scanner for AI/LLM models and endpoints (prompt injection, jailbreaks, system-prompt & data leakage, insecure output)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Upadhyay123a" }]
keywords = ["llm", "ai-security", "prompt-injection", "jailbreak", "dast", "red-team", "owasp-llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
# Zero required runtime dependencies — uses only the Python standard library,
# so it runs anywhere and can test any model without a heavy install.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
aegis-ai = "aegis_ai.cli:main"

[project.urls]
Homepage = "https://github.com/Upadhyay123a/aegis-dast"
Repository = "https://github.com/Upadhyay123a/aegis-dast"

[tool.hatch.build.targets.wheel]
packages = ["aegis_ai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
